# Runs the IB9JHO setup scripts on real Windows, macOS and Ubuntu machines, so
# that changes to the scripts (or to the packages they install) are tested on
# every operating system students use, without needing the hardware locally.
#
# Each job runs the full setup (installing whatever the runner image lacks),
# builds this repository with the "clang" CMake preset, then re-runs the
# script in check-only mode to prove a second run is clean. The setup logs are
# uploaded as artefacts for inspection.

name: Environment setup scripts

# Runs on pull requests that touch the scripts, weekly, and on demand; pushes
# to main are not tested again, as every change reaches main through a PR.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "CMakePresets.json"
      - ".github/workflows/environment-setup.yml"
  workflow_dispatch:
  schedule:
    # Weekly, to catch upstream changes (package renames, new compiler
    # releases) and broken course repositories before students hit them.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint-shell:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  lint-powershell:
    name: Lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          # Write-Host is intentional (coloured console output for students);
          # the state-changing helpers are internal to a script that is itself
          # the confirmation boundary; and the script parameters are read by
          # functions through script scope, which the unused-parameter rule
          # cannot see.
          $excluded = @('PSAvoidUsingWriteHost', 'PSUseShouldProcessForStateChangingFunctions', 'PSReviewUnusedParameter')
          $findings = Invoke-ScriptAnalyzer -Path scripts/setup-windows.ps1 -Severity Warning, Error -ExcludeRule $excluded
          $findings | Format-Table -AutoSize RuleName, Line, Message | Out-String -Width 300 | Write-Output
          if ($findings) { exit 1 }

  windows:
    name: Windows (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Students run the script from Windows PowerShell 5.1 by default.
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - name: Run setup
        run: ./scripts/setup-windows.ps1 -Yes -Project . -LogFile "$env:RUNNER_TEMP\setup.log"
      - name: Re-run in check-only mode
        run: ./scripts/setup-windows.ps1 -CheckOnly -Project . -LogFile "$env:RUNNER_TEMP\check.log"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-logs-windows-${{ matrix.shell }}
          path: ${{ runner.temp }}/*.log

  macos:
    name: macOS (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon and Intel Macs.
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - name: Run setup
        run: bash scripts/setup-macos.sh --yes --project . --log-file "$RUNNER_TEMP/setup.log"
      - name: Re-run in check-only mode
        run: bash scripts/setup-macos.sh --check-only --project . --log-file "$RUNNER_TEMP/check.log"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-logs-${{ matrix.runner }}
          path: ${{ runner.temp }}/*.log

  linux:
    name: Linux (ubuntu-latest runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run setup
        run: bash scripts/setup-linux.sh --yes --project . --log-file "$RUNNER_TEMP/setup.log"
      - name: Re-run in check-only mode
        run: bash scripts/setup-linux.sh --check-only --project . --log-file "$RUNNER_TEMP/check.log"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-logs-ubuntu-runner
          path: ${{ runner.temp }}/*.log

  linux-clean-ubuntu:
    name: Linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    # Clean Ubuntu containers have none of the tools installed, so these jobs
    # exercise every install path from scratch. Ubuntu is the only Linux
    # distribution tested; the script's other package managers are best effort.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v5
      - name: Run setup
        run: bash scripts/setup-linux.sh --yes --project . --log-file /tmp/logs/setup.log
      - name: Re-run in check-only mode
        run: bash scripts/setup-linux.sh --check-only --project . --log-file /tmp/logs/check.log
      - name: Name the log artefact
        if: always()
        id: artefact
        run: echo "name=setup-logs-$(echo '${{ matrix.image }}' | tr ':/' '--')" >> "$GITHUB_OUTPUT"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artefact.outputs.name }}
          path: /tmp/logs/*.log

  course-repositories:
    # Clone every lab solution and example in the organisation and build and
    # test it with the tool chain installed by the setup script, so that a
    # broken repository (or a tool chain change that breaks one) is caught
    # before students meet it. Benchmarks are excluded from the test runs.
    #
    # The lab solutions are private (readable by the class only), so listing
    # and cloning them needs a token with read access to the organisation's
    # repositories, stored as the COURSE_REPOS_TOKEN secret. Without it the
    # workflow's own token is used and only the public examples are tested.
    name: Course repositories (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ORG: IB9JHO-2026-2027
      GH_TOKEN: ${{ secrets.COURSE_REPOS_TOKEN || github.token }}
      HAS_COURSE_TOKEN: ${{ secrets.COURSE_REPOS_TOKEN != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Select repositories
        # Every non-fork, unarchived repository that is either a lab solution
        # (*-solutions, private) or public (the examples). Other private
        # repositories, such as student assignment copies, are never selected.
        # Lab starter repositories, assignments, templates and tooling
        # repositories are excluded: their tests are meant to fail until
        # students complete them.
        run: |
          if [ "$HAS_COURSE_TOKEN" != "true" ]; then
            echo "::warning::The COURSE_REPOS_TOKEN secret is not set, so the private lab solutions cannot be read and only public repositories are tested."
          fi
          gh api --paginate "orgs/$ORG/repos?per_page=100&type=all" \
            --jq '.[] | select(.fork | not) | select(.archived | not)
                  | select(.visibility == "public" or (.name | endswith("-solutions"))) | .name' > all-repos.txt
          awk '
            tolower($0) ~ /(assignment|environment-setup|group-project-template|classroom)/ { next }
            tolower($0) ~ /^lab[0-9]+$/ { next }
            { print }
          ' all-repos.txt | sort > selected-repos.txt
          echo "Selected $(wc -l < selected-repos.txt) repositories:"
          cat selected-repos.txt
          if ! grep -q -- '-solutions$' selected-repos.txt; then
            echo "::warning::No lab solution repositories (*-solutions) were found, so no lab solutions were tested."
          fi

      - name: Clone repositories
        run: |
          mkdir -p course-repos
          while read -r name; do
            gh repo clone "$ORG/$name" "course-repos/$name" -- --depth 1 --quiet
          done < selected-repos.txt

      - name: Install the tool chain (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/setup-linux.sh --yes --skip-vscode --log-file "$RUNNER_TEMP/setup.log"

      - name: Install the tool chain (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/setup-macos.sh --yes --skip-vscode --log-file "$RUNNER_TEMP/setup.log"

      - name: Install the tool chain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup-windows.ps1 -Yes -SkipVSCode -LogFile "$env:RUNNER_TEMP\setup.log"
          # Make the tools found by the setup script available to later steps.
          foreach ($tool in 'clang++', 'cmake', 'ninja') {
              Split-Path (Get-Command $tool).Source | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Build and test
        run: bash scripts/test-course-repos.sh --log-dir course-repo-logs course-repos/*

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-repo-logs-${{ matrix.os }}
          path: |
            course-repo-logs/
            ${{ runner.temp }}/setup.log
